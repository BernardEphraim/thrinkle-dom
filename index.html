<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <thrinkle-container type="fluid" break="sm">
		<thrinkle-column size='3' offset='6' break="sm">
			<div style="height: 58px; background-color:tomato;">rty</div>
			<div style="height: 58px; background-color:orange">rty</div>
            <thrinkle-alert 
            animationname="rotate-diagonal-tl-animation"
            animationdirection="forwards"
            animationfillmode="both"    
            animationduration="1s"
            animationtimingfunction="ease-in-out"
            animationiterationcount="1"
            type="warning" 
            size="12"
            iconsize="16"
            alignment="right"
            displaycaption
            caption="Success"
            aligncaption="center"
            closable="true"
            borderline="bottom"
            >
            Lorem, ipsum dolor sit amet 
            consectetur adipisicing elit. Obcaecati, 
            perspiciatis neque omnis et minus, tenetur 
            aspernatur fugiat nesciunt delectus nemo 
            aliquam deleniti eius voluptatem blanditiis, 
            a iste ipsum culpa dolore?
            </thrinkle-alert>
		</thrinkle-column>
		<thrinkle-column size='3'>44</thrinkle-column>
	</thrinkle-container>
</body>

<script type="module" src="./thrinkle-dom.js"></script>
</html>
